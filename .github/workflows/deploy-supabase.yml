
name: Deploy Support Email Function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/support-email/**"
      - ".github/workflows/deploy-supabase.yml"
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy support-email --project-ref yvtnonaslnopdgeuqzfc
        
